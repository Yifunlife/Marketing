<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件存储 · 亦玩集团</title><style>body{background:#f5f7fb;color:#19375f;font:16px/1.7 system-ui;margin:0}main{max-width:900px;margin:40px auto;padding:26px;background:white;border-radius:18px}button,input{font:inherit;padding:10px}li{padding:14px;border-bottom:1px solid #edf1f5}a{color:#204c82}</style><main><a href="/">← 返回运营看板</a><h1>文件存储</h1><p>文件保存在 Cloudflare R2；数据库仅保存名称、大小、归属和访问路径。支持图片、PDF和视频，单文件不超过100MB。</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,video/mp4,video/quicktime,video/webm"><button id="upload">上传至R2</button><p id="status" role="status"></p><ul id="list"></ul></main><script>const status=document.querySelector('#status');async function list(){try{const r=await fetch('/api/files');const d=await r.json();if(!r.ok)throw Error(d.error);const ul=document.querySelector('#list');ul.replaceChildren();for(const f of d.files){const li=document.createElement('li'),a=document.createElement('a');a.textContent=f.original_name+' · '+(f.size_bytes/1024).toFixed(1)+' KB';a.href='/api/files/'+encodeURIComponent(f.id);li.append(a);ul.append(li);}if(!d.files.length)status.textContent='尚无文件';}catch(e){status.textContent=e.message+'，请先返回看板登录。';}}document.querySelector('#upload').onclick=async()=>{const f=document.querySelector('#file').files[0],button=document.querySelector('#upload');if(!f)return;button.disabled=true;status.textContent='正在上传…';try{const r=await fetch('/api/files',{method:'POST',headers:{'Content-Type':f.type,'X-File-Name':encodeURIComponent(f.name)},body:f});const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent='上传成功，文件已保存至R2';await list();}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};list();</script></html>
