<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音报表上传 · 亦玩集团</title>
<link rel="stylesheet" href="/brand.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#19375f;font:14px/1.5 system-ui}
main{max-width:1160px;margin:16px auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
header small{font-size:11px;color:#6e7e93}
h1{font-size:24px;line-height:1.3;margin:4px 0 0}
.notice{padding:12px 16px;background:#edf3fa;border:1px solid #dce4ef;border-radius:10px}
.notice strong{font-size:14px}
.notice .steps{display:inline;margin-left:16px;color:#4e6580}
.notice .muted{font-size:12px;margin-top:4px}
.muted{color:#6e7e93}
#global{font-size:12px;color:#61758e;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px;align-items:start}
.card{min-width:0;padding:16px;background:white;border:1px solid #dce4ef;border-radius:10px}
.account-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h2{font-size:18px;margin:0;line-height:1.4}
button,.button{display:inline-block;font:inherit;font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid #c9d7e8;background:#204a7a;color:white;cursor:pointer;text-decoration:none;white-space:nowrap}
.account-head .button{background:white;color:#204a7a;font-size:12px;padding:5px 8px}
button:disabled{opacity:.5;cursor:default}
a{color:#174f89}
dl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;margin:0 0 12px;font-size:12px;padding-bottom:10px;border-bottom:1px solid #edf1f6}
dt{color:#6e7e93}dd{margin:0;overflow-wrap:anywhere}
form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
select,input[type=file]{font:inherit;font-size:13px;max-width:100%;width:100%;min-width:0;padding:6px 8px;border:1px solid #c9d7e8;border-radius:7px;background:white}
form select{grid-column:1;grid-row:1}
form>button{grid-column:2;grid-row:1}
input[type=file]{grid-column:1/-1}
.confirm{display:flex;gap:6px;align-items:center;grid-column:1/-1;font-size:12px;color:#61758e}
.confirm input{margin:0}
.message{grid-column:1/-1;white-space:pre-wrap;font-size:12px;margin:0}
.message:empty{display:none}
.file-hint{font-size:11px;margin:8px 0;color:#7e8da1}
details{margin-top:10px;border-top:1px solid #edf1f6;padding-top:8px;font-size:12px}
summary{cursor:pointer;color:#4e6580}
.reports{padding-left:16px;margin:6px 0 0}
.reports li{padding:5px 0;overflow-wrap:anywhere}
.review-message{font-size:12px;color:#ae4937;margin:6px 0 0}
.daily-status{margin:0 0 12px;font-size:12px}
.daily-status strong{font-size:12px;font-weight:500;color:#536b86}
.daily-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.daily-badge{padding:3px 7px;border-radius:5px;background:#f3f5f8;color:#7b8796;font-size:11px}
.daily-badge[data-state=pending]{background:#fff4df;color:#8d6219}
.daily-badge[data-state=imported]{background:#eaf6ef;color:#297146}
.daily-badge[data-state=failed],.daily-badge[data-state=rejected]{background:#fff0ed;color:#ae4937}
@media(max-width:640px){
 main{padding:0 12px;margin:12px auto}
 h1{font-size:21px}.notice .steps{display:block;margin:4px 0 0}
 .cards{grid-template-columns:minmax(0,1fr)}
 .card{padding:14px}h2{font-size:17px}
 dl{grid-template-columns:auto 1fr}
}
</style>
<main>
<header><div><small>YIFUN LIFE / 运营工作台</small><h1>运营数据同步区</h1></div></header>
<div class="notice">
<strong>抖音报表上传</strong><div class="steps">打开官方后台 → 导出报表 → 选择账号上传</div>
<div class="muted">每天上传1—2次，保留原始文件。核对账号、日期和表头后更新看板。</div>
<div id="ads" class="muted"></div>
</div>
<p id="global" role="status">正在加载账号与报表记录…</p>
<div class="cards" id="cards"></div>
<script src="/ops-sync.js"></script>
</main>
</html>
