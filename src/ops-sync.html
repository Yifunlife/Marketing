<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音运营数据采集 · 亦玩集团</title><link rel="stylesheet" href="/brand.css"><style>body{margin:0;background:#f4f7fb;color:#19375f;font:16px/1.65 system-ui}main{max-width:960px;margin:36px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:10px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin:24px 0}.card,.notice{padding:24px;background:white;border:1px solid #dce4ef;border-radius:14px}.muted{color:#6e7e93}button,.button{display:inline-block;font:inherit;padding:10px 16px;border-radius:8px;border:1px solid #c9d7e8;background:#204a7a;color:white;cursor:pointer;margin:6px 8px 6px 0;text-decoration:none}button:disabled{opacity:.5;cursor:default}.secondary{background:white;color:#204a7a}.status{font-weight:600}.preview{display:block;width:100%;border:1px solid #ddd;border-radius:8px;margin:12px 0}.message{white-space:pre-wrap}a{color:#174f89}dl{display:grid;grid-template-columns:110px 1fr;margin:16px 0}dt{color:#6e7e93}dd{margin:0;overflow-wrap:anywhere}.preview{cursor:zoom-in;max-width:360px;margin:16px auto;image-rendering:auto}#scan-preview{width:95vw;max-width:1500px;padding:16px;border:1px solid #dce4ef;border-radius:14px;color:#19375f}#scan-preview::backdrop{background:#10233bcc}.preview-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.preview-toolbar strong{margin-right:auto}.preview-viewport{overflow:auto;max-height:75vh;background:#f4f7fb}.preview-viewport img{display:block;width:100%;max-width:1280px;height:auto;margin:auto}@media(max-width:640px){main{padding:0 12px}.cards{grid-template-columns:minmax(0,1fr)}} form{display:grid;gap:12px;margin-top:18px}select,input[type=file]{font:inherit;max-width:100%;box-sizing:border-box;padding:8px;border:1px solid #c9d7e8;border-radius:8px}.confirm{display:flex;gap:8px;align-items:center}.reports{padding-left:20px}.reports li{padding:8px 0;overflow-wrap:anywhere}h3{font-size:16px} .message:empty{display:none}</style><main><header><div><small>YIFUN LIFE / 运营工作台</small><h1>运营数据同步区</h1></div></header><div class="notice"><strong>抖音运营数据 · 官方报表上传</strong><div>① 打开官方后台并登录　→　② 导出报表　→　③ 选择账号上传</div><div class="muted">运营人员每天上传一至两次。请上传官方原始文件，先核对账号、统计日期和表头，再更新看板指标。</div><div id="ads" class="muted"></div></div><p id="global" role="status">正在加载账号与报表记录…</p><div class="cards" id="cards"></div><script src="/ops-sync.js"></script></main></html>
