<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>亦玩集团运营智能体</title><style>body{margin:0;font-family:system-ui;background:light-dark(#f5f6fb,#151e2a)}#growth-agent{border-radius:0;min-height:100vh}</style></head><body><script>window.openai={widgetState:null,setWidgetState:async function(s){localStorage.setItem('yifun-demo-state',JSON.stringify(s));}};</script><div id="growth-agent">
<style>
#growth-agent{--bg:light-dark(#f3f6f8,#151d25);--surface:light-dark(#ffffff,#202d38);--text:light-dark(#173344,#e7f1f5);--muted:light-dark(#526d7d,#afc3ce);--edge:light-dark(#dce6eb,#3b505e);--brand:light-dark(#126753,#83ddbd);--on:light-dark(#ffffff,#102d24);background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif;border-radius:16px;overflow:hidden}#growth-agent *{box-sizing:border-box}#growth-agent h2,#growth-agent h3,#growth-agent p{margin:0}#growth-agent h2{font-size:22px;font-weight:500}#growth-agent h3{font-size:16px;font-weight:500}#growth-agent header{background:var(--surface);padding:24px 28px;border-bottom:1px solid var(--edge)}#growth-agent small,#growth-agent .muted{color:var(--muted)}#growth-agent nav{display:flex;gap:6px;flex-wrap:wrap;padding:16px 24px}#growth-agent button,#growth-agent select,#growth-agent input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--edge);border-radius:8px;padding:8px 12px;max-width:100%}#growth-agent button.active,#growth-agent .primary{background:var(--brand);color:var(--on);border-color:var(--brand)}#growth-agent main{padding:0 24px 24px}#growth-agent .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}#growth-agent .panel{background:var(--surface);padding:18px;border:1px solid var(--edge);border-radius:12px;margin-bottom:16px}#growth-agent .grid .panel{margin:0}#growth-agent .value{font-size:27px;font-weight:500;font-variant-numeric:tabular-nums}#growth-agent .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}#growth-agent .between{justify-content:space-between}#growth-agent .badge{color:var(--brand);background:var(--bg);border-radius:6px;padding:3px 8px;display:inline-block}#growth-agent .scroll{overflow:auto}#growth-agent table{border-collapse:collapse;width:100%;min-width:660px}#growth-agent td,#growth-agent th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--edge);font-weight:400}#growth-agent th{color:var(--muted)}#growth-agent .flow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}#growth-agent .flow span{padding:8px 12px;background:var(--surface);border:1px solid var(--edge);border-radius:8px}#growth-agent .bar{height:8px;background:var(--bg);margin-top:5px;border-radius:4px;overflow:hidden}#growth-agent .bar i{display:block;height:100%;background:var(--brand)}#growth-agent .log{padding:10px 0;border-bottom:1px solid var(--edge)}#growth-agent #ga-message{color:var(--brand);margin-top:12px}#growth-agent .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}#growth-agent .entry{padding:14px 0;border-bottom:1px solid var(--edge)}@media(max-width:650px){#growth-agent .grid{grid-template-columns:1fr 1fr}#growth-agent .two{grid-template-columns:1fr}#growth-agent header{padding:20px 16px}#growth-agent main{padding:0 14px 18px}#growth-agent nav{padding:14px}#growth-agent .value{font-size:23px}}@media(pointer:coarse){#growth-agent button,#growth-agent select{min-height:44px}}

#growth-agent .ga-shell{display:grid;grid-template-columns:174px minmax(0,1fr)}
#growth-agent aside{background:var(--surface);border-right:1px solid var(--edge);padding:20px 12px}
#growth-agent .ga-menu-label{color:var(--muted);padding:0 10px 14px}
#growth-agent nav{display:flex;flex-direction:column;padding:0;gap:8px}
#growth-agent nav button{text-align:left;width:100%;border-color:transparent;padding:12px}
#growth-agent .ga-side-note{margin-top:36px;padding:14px 10px;border-top:1px solid var(--edge);color:var(--muted)}
#growth-agent main{min-width:0;padding-top:20px}
@media(max-width:760px){#growth-agent .grid{grid-template-columns:1fr 1fr}#growth-agent .two{grid-template-columns:1fr}#growth-agent .ga-shell{grid-template-columns:140px minmax(0,1fr)}#growth-agent aside{padding:18px 8px}}
@media(max-width:480px){#growth-agent .ga-shell{grid-template-columns:100px minmax(0,1fr)}#growth-agent aside{padding:16px 4px}#growth-agent nav button{padding:10px 6px}#growth-agent .ga-menu-label,#growth-agent .ga-side-note{padding-left:6px;padding-right:6px}#growth-agent main{padding:16px 10px}#growth-agent .grid{grid-template-columns:1fr}#growth-agent .panel{padding:12px}#growth-agent .flow{display:none}}

#growth-agent{--brand:light-dark(#2d5685,#9bbce2);--bg:light-dark(#f5f6fb,#151e2a);--gold:light-dark(#b5832d,#d9b46b)}
#growth-agent aside{background:light-dark(#193a65,#142b49);color:light-dark(#edf3ff,#edf3ff)}
#growth-agent aside button{background:transparent;color:inherit}#growth-agent aside button.active{background:light-dark(#325784,#325784);color:light-dark(#ffffff,#ffffff);border-left:3px solid var(--gold)}
#growth-agent .ga-menu-label,#growth-agent .ga-side-note,#growth-agent .ga-side-note small{color:light-dark(#c3cee0,#c3cee0)}
#growth-agent .summary{border-top:3px solid var(--brand)}#growth-agent .summary.foreign{border-top-color:var(--gold)}
#growth-agent .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
#growth-agent .summary-cell{padding:12px 9px;border-bottom:1px solid var(--edge);min-width:0}
#growth-agent .summary-cell strong{display:block;font-size:17px;font-weight:500;overflow-wrap:anywhere}
#growth-agent .platforms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
#growth-agent .platform{border:1px solid var(--edge);border-top:3px solid var(--brand);border-radius:8px;padding:12px;min-width:0}
#growth-agent .foreign-platforms{grid-template-columns:repeat(2,minmax(0,1fr))}#growth-agent .foreign-platforms .platform{border-top-color:var(--gold)}
#growth-agent .platform button{display:block;text-align:left;border:0;padding:7px 0;color:var(--brand);overflow-wrap:anywhere;white-space:normal;width:100%}
#growth-agent .account-detail{padding:12px;background:var(--bg);border-radius:8px;margin-top:12px}
#growth-agent .flow{display:none}
@media(max-width:650px){#growth-agent .summary-grid{grid-template-columns:1fr 1fr}#growth-agent .platforms{grid-template-columns:1fr}#growth-agent .foreign-platforms{grid-template-columns:1fr}}

#growth-agent nav .ga-submenu{display:flex;flex-direction:column;gap:3px;padding:2px 0 8px 14px}
#growth-agent nav .ga-submenu button{padding:8px;color:light-dark(#c8d9ef,#c8d9ef);overflow-wrap:anywhere}
#growth-agent nav .ga-submenu button.selected{background:light-dark(#284e78,#284e78);color:light-dark(#ffffff,#ffffff)}
</style>
<link rel="stylesheet" href="/brand.css"><header><div class="row between"><div class="brand-title"><img src="/brand-logo.png" alt="亦玩集团 YIFUN LIFE" class="brand-logo"><div><span class="brand-kicker">OPERATIONS INTELLIGENCE</span><h2>亦玩集团运营智能体</h2></div></div><span class="badge">正式运营</span></div><p class="muted">运营部工作台 / 中心看板 · </p></header>
<div class="ga-shell"><aside><nav aria-label="主菜单" id="ga-nav"></nav><div class="ga-side-note">YIFUN WORKPLACE<br><small>获客 · 分配 · 成交 · 优化</small></div></aside>
<main><div class="flow"><span>① 渠道接入</span><span>→ ② 客户整理与分配</span><span>→ ③ CRM 跟进</span><span>→ ④ 成交归因</span><span>→ ⑤ 投放优化</span></div><div id="ga-body"></div><p id="ga-message" role="status" aria-live="polite">点击不同工作区，体验完整业务闭环。</p></main></div>
<script src="app.js"></script></div></body></html>
